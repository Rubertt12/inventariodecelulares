<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>VOKE | Gestor ZPL Completo + Excel</title>
    <script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <link rel="stylesheet" href="zebra/zebra.css">
</head>
<body>

<div class="editor-panel">
    <button class="back-button" onclick="window.location.href='../celular.rubertt.html'">← Voltar</button>
    
    <div class="row extracted-inline-style-1">
        <button class="btn-save" onclick="salvarConfiguracao()">Salvar Ajustes</button>
        <button class="btn-reset" onclick="restaurarPadrao()">Restaurar</button>
    </div>

    <!-- MÓDULO EXCEL -->
    <div class="excel-box">
        <label class="extracted-inline-style-2">📊 Importar Lote via Excel</label>
        <p class="extracted-inline-style-3">Colunas: <b>Patrimonio</b>, <b>Serial</b>, <b>Qtd</b> (ou <b>IMEI1</b>, <b>IMEI2</b>, <b>SN</b>)</p>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" onchange="processarExcel(event)" class="extracted-inline-style-4">
        <div class="row">
            <button class="btn-excel" onclick="document.getElementById('excelFile').click()">Subir Excel (.xlsx)</button>
            <button id="btnClearExcel" class="btn-reset extracted-inline-style-5" onclick="limparExcel()">Limpar Lote</button>
        </div>
        <button onclick="baixarModeloExcel()" class="extracted-inline-style-6">Baixar Modelo Planilha</button>
    </div>

    <h3>Modelo & Posições</h3>
    <select id="templateSelector" onchange="carregarModelo()">
        <option value="padrao">Modelo Padrão VOKE</option>
        <option value="celular">Modelo Celular</option>
        <option value="minimal">Modelo Minimalista</option>
    </select>

    <!-- CONTROLES MODELO PADRÃO -->
    <div id="controlsPadrao" class="extracted-inline-style-7">
        <div class="row extracted-inline-style-8">
            <label>PW: <input type="number" id="pw_padrao" value="560" oninput="gerar()"></label>
            <label>LL: <input type="number" id="ll_padrao" value="300" oninput="gerar()"></label>
        </div>
        <div class="control-group extracted-inline-style-9">
            <label>Título:</label>
            <input type="text" id="val_t" value="DEVOLUCAO VOKE" oninput="gerar()">
            <div class="field-controls-container">
                <div class="font-controls">
                    <button class="font-control-btn" onclick="ajustarFonte('t', 5)">+</button>
                    <button class="font-control-btn" onclick="ajustarFonte('t', -5)">-</button>
                </div>
                <div class="pos-controls-grid">
                    <button class="pos-control-btn pos-up" onclick="ajustarPosicao('t', 'y', -5)">▲</button>
                    <button class="pos-control-btn pos-left" onclick="ajustarPosicao('t', 'x', -5)">◀</button>
                    <button class="pos-control-btn pos-right" onclick="ajustarPosicao('t', 'x', 5)">▶</button>
                    <button class="pos-control-btn pos-down" onclick="ajustarPosicao('t', 'y', 5)">▼</button>
                </div>
            </div>
        </div>
        <div class="control-group">
            <label>Patrimônio:</label>
            <input type="text" id="val_p" value="AM005473" oninput="gerar()">
            <div class="field-controls-container">
                <div class="font-controls">
                    <button class="font-control-btn" onclick="ajustarFonte('p', 5)">+</button>
                    <button class="font-control-btn" onclick="ajustarFonte('p', -5)">-</button>
                </div>
                <div class="pos-controls-grid">
                    <button class="pos-control-btn pos-up" onclick="ajustarPosicao('p', 'y', -5)">▲</button>
                    <button class="pos-control-btn pos-left" onclick="ajustarPosicao('p', 'x', -5)">◀</button>
                    <button class="pos-control-btn pos-right" onclick="ajustarPosicao('p', 'x', 5)">▶</button>
                    <button class="pos-control-btn pos-down" onclick="ajustarPosicao('p', 'y', 5)">▼</button>
                </div>
            </div>
        </div>
        <div class="control-group">
            <label>Serial / Barcode:</label>
            <input type="text" id="val_s" value="3X0D6R3" oninput="sincronizarSerial(this.value)">
            <div class="field-controls-container">
                <div class="font-controls">
                    <button class="font-control-btn" onclick="ajustarFonte('s', 5)">+</button>
                    <button class="font-control-btn" onclick="ajustarFonte('s', -5)">-</button>
                </div>
                <div class="pos-controls-grid">
                    <button class="pos-control-btn pos-up" onclick="ajustarPosicao('s', 'y', -5)">▲</button>
                    <button class="pos-control-btn pos-left" onclick="ajustarPosicao('s', 'x', -5)">◀</button>
                    <button class="pos-control-btn pos-right" onclick="ajustarPosicao('s', 'x', 5)">▶</button>
                    <button class="pos-control-btn pos-down" onclick="ajustarPosicao('s', 'y', 5)">▼</button>
                </div>
            </div>
        </div>
        <div class="control-group">
            <label>Posição do Código de Barras:</label>
            <div class="field-controls-container">
                <div class="font-controls"></div>
                <div class="pos-controls-grid">
                    <button class="pos-control-btn pos-up" onclick="ajustarPosicao('b', 'y', -5)">▲</button>
                    <button class="pos-control-btn pos-left" onclick="ajustarPosicao('b', 'x', -5)">◀</button>
                    <button class="pos-control-btn pos-right" onclick="ajustarPosicao('b', 'x', 5)">▶</button>
                    <button class="pos-control-btn pos-down" onclick="ajustarPosicao('b', 'y', 5)">▼</button>
                </div>
            </div>
        </div>
        <input type="hidden" id="bc_type_padrao" value="B3N,N,90,Y,N">
        <input type="hidden" id="val_b" value="3X0D6R3">
    </div>

    <!-- CONTROLES MODELO CELULAR -->
    <div id="controlsCelular" class="extracted-inline-style-10">
        <div class="row extracted-inline-style-11">
            <label>PW: <input type="number" id="pw_cel" value="560" oninput="gerar()"></label>
            <label>LL: <input type="number" id="ll_cel" value="300" oninput="gerar()"></label>
        </div>
        <div class="control-group extracted-inline-style-12">
            <label>IMEI 1:</label>
            <input type="text" id="val_imei1" value="" oninput="gerar()" placeholder="Obrigatório">
            <div class="field-controls-container">
                <div class="font-controls">
                    <button class="font-control-btn" onclick="ajustarFonte('imei1', 5)">+</button>
                    <button class="font-control-btn" onclick="ajustarFonte('imei1', -5)">-</button>
                </div>
                <div class="pos-controls-grid">
                    <button class="pos-control-btn pos-up" onclick="ajustarPosicao('imei1', 'y', -5)">▲</button>
                    <button class="pos-control-btn pos-left" onclick="ajustarPosicao('imei1', 'x', -5)">◀</button>
                    <button class="pos-control-btn pos-right" onclick="ajustarPosicao('imei1', 'x', 5)">▶</button>
                    <button class="pos-control-btn pos-down" onclick="ajustarPosicao('imei1', 'y', 5)">▼</button>
                </div>
            </div>
        </div>
        <div class="control-group">
            <label>IMEI 2:</label>
            <input type="text" id="val_imei2" value="" oninput="gerar()" placeholder="Opcional">
            <div class="field-controls-container">
                <div class="font-controls">
                    <button class="font-control-btn" onclick="ajustarFonte('imei2', 5)">+</button>
                    <button class="font-control-btn" onclick="ajustarFonte('imei2', -5)">-</button>
                </div>
                <div class="pos-controls-grid">
                    <button class="pos-control-btn pos-up" onclick="ajustarPosicao('imei2', 'y', -5)">▲</button>
                    <button class="pos-control-btn pos-left" onclick="ajustarPosicao('imei2', 'x', -5)">◀</button>
                    <button class="pos-control-btn pos-right" onclick="ajustarPosicao('imei2', 'x', 5)">▶</button>
                    <button class="pos-control-btn pos-down" onclick="ajustarPosicao('imei2', 'y', 5)">▼</button>
                </div>
            </div>
        </div>
        <div class="control-group">
            <label>SN:</label>
            <input type="text" id="val_sn" value="" oninput="gerar()" placeholder="Obrigatório">
            <div class="field-controls-container">
                <div class="font-controls">
                    <button class="font-control-btn" onclick="ajustarFonte('sn', 5)">+</button>
                    <button class="font-control-btn" onclick="ajustarFonte('sn', -5)">-</button>
                </div>
                <div class="pos-controls-grid">
                    <button class="pos-control-btn pos-up" onclick="ajustarPosicao('sn', 'y', -5)">▲</button>
                    <button class="pos-control-btn pos-left" onclick="ajustarPosicao('sn', 'x', -5)">◀</button>
                    <button class="pos-control-btn pos-right" onclick="ajustarPosicao('sn', 'x', 5)">▶</button>
                    <button class="pos-control-btn pos-down" onclick="ajustarPosicao('sn', 'y', 5)">▼</button>
                </div>
            </div>
        </div>
        <div class="control-group">
            <label>Nome (Reserva):</label>
            <input type="text" id="val_nome" value="" oninput="gerar()" placeholder="Opcional">
        </div>
    </div>

    <!-- CAMPO QTD MANUAL (USADO QUANDO NÃO HÁ EXCEL) -->
    <div class="control-group extracted-inline-style-13" id="boxQtdManual">
        <label for="qtd_etiquetas" class="extracted-inline-style-14">Qtd. de Etiquetas (Manual):</label>
        <input type="number" id="qtd_etiquetas" value="1" min="1" max="999" oninput="gerar()">
    </div>

    <p class="extracted-inline-style-15">Código ZPL (Edite Livremente):</p>
    <textarea id="zplCode" oninput="atualizarPreview(this.value)"></textarea>
    
    <button class="btn-print" onclick="enviarParaImpressora()">Imprimir via QZ Tray</button>
</div>

<div class="preview-panel">
    <h3>Preview</h3>
    <img id="labelPreview" src="" class="extracted-inline-style-16">
</div>


    <script src="zebra/zebra.js"></script>
</body>
</html>
